<app-section heading="What Families Say">
  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (testimonials().length === 0) {
    <p class="muted">Testimonials coming soon.</p>
  } @else {
    <div class="grid">
      @for (t of testimonials(); track t.id) {
        <app-card>
          <blockquote>“{{ t.quote }}”</blockquote>
          <p class="attribution">
            — {{ t.attribution }}@if (t.location) {, {{ t.location }}}
          </p>
        </app-card>
      }
    </div>
  }
</app-section>
