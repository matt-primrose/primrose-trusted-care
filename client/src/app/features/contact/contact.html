<app-section heading="Contact Us">
  <div class="layout">
    <aside class="info" [innerHTML]="contactHtml()"></aside>

    <form [formGroup]="form" (ngSubmit)="submit()" class="contact-form" novalidate>
      <label>
        Name
        <input formControlName="name" type="text" autocomplete="name" required />
      </label>

      <label>
        Email
        <input formControlName="email" type="email" autocomplete="email" required />
      </label>

      <label>
        Phone <span class="opt">(optional)</span>
        <input formControlName="phone" type="tel" autocomplete="tel" />
      </label>

      <label>
        How can we help?
        <textarea formControlName="message" rows="6" required></textarea>
      </label>

      <!-- honeypot -->
      <label class="hp" aria-hidden="true">
        Leave this field empty
        <input formControlName="honeypot" type="text" tabindex="-1" autocomplete="off" />
      </label>

      <button type="submit" [disabled]="state() === 'submitting'">
        {{ state() === 'submitting' ? 'Sending…' : 'Send' }}
      </button>

      @if (state() === 'success') {
        <p class="success">
          Thanks — we received your note and will be in touch soon.
          @if (confirmed()) {
            <span class="badge">✓ confirmed</span>
          }
        </p>
      }
      @if (state() === 'error') {
        <p class="error">Something went wrong. Please try again or email us directly.</p>
      }
    </form>
  </div>
</app-section>
